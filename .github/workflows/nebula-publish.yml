name: "Publish candidate/release to NetflixOSS and Maven Central"
on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-rc.*
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup git user
        run: |
          git config --global user.name "NetflixOss Maintainers"
          git config --global user.email "netflix-oss@netflix.com"
      - name: Setup jdk 8
        uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: 'zulu'
      - uses: actions/cache@v5
        id: gradle-cache
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/dependency-locks/*.lockfile') }}
          restore-keys: |
            - ${{ runner.os }}-gradle-
      - uses: actions/cache@v5
        id: gradle-wrapper-cache
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradlewrapper-${{ hashFiles('gradle/wrapper/*') }}
          restore-keys: |
            - ${{ runner.os }}-gradlewrapper-
      - name: Publish candidate
        if: contains(github.ref, '-rc.')
        run: ./gradlew --info --stacktrace -Prelease.useLastTag=true candidate
        env:
          NETFLIX_OSS_SIGNING_KEY: ${{ secrets.ORG_SIGNING_KEY }}
          NETFLIX_OSS_SIGNING_PASSWORD: ${{ secrets.ORG_SIGNING_PASSWORD }}
          NETFLIX_OSS_REPO_USERNAME: ${{ secrets.ORG_NETFLIXOSS_USERNAME }}
      - name: Debug env (no secrets)  
        run: |  
          echo "NETFLIX_OSS_SONATYPE_USERNAME is set? ${NETFLIX_OSS_SONATYPE_USERNAME:+yes}"
          echo "NETFLIX_OSS_SONATYPE_PASSWORD is set? ${NETFLIX_OSS_SONATYPE_PASSWORD:+yes}"
        env:
          NETFLIX_OSS_SONATYPE_USERNAME: ${{ secrets.ORG_SONATYPE_USERNAME }}
          NETFLIX_OSS_SONATYPE_PASSWORD: ${{ secrets.ORG_SONATYPE_PASSWORD }}
